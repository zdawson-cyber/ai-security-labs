name: AI governance mapping checks
on:
  push:
    paths:
      - 'labs/03-ai-governance-control-checker/**'
      - '.github/workflows/ai-governance-mapping.yml'
  pull_request:
    paths:
      - 'labs/03-ai-governance-control-checker/**'
      - '.github/workflows/ai-governance-mapping.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate crosswalk coverage and failure cases
        run: python -m unittest discover -s labs/03-ai-governance-control-checker -p test_crosswalk.py -v
      - name: Check documentation presence
        run: python labs/03-ai-governance-control-checker/validate_crosswalk.py > /tmp/ai-governance-report.json
